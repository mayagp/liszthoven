<div
  class="space-y-3 rounded-lg bg-white p-3 backdrop-blur-sm @container dark:bg-neutral-900"
>
  <div class="flex items-center">
    <h3 class="flex-1 text-sm font-medium">{{ title }}</h3>
    <button
      class="rounded-md p-2 hover:bg-zinc-200 hover:dark:bg-zinc-700"
      (click)="onClose()"
    >
      <fa-icon [fixedWidth]="true" [icon]="faTimes"></fa-icon>
    </button>
  </div>
  <ng-container *ngIf="!selectedPurchaseInvoiceDetail">
    <div
      class="customer-list h-[400px] overflow-auto rounded dark:bg-neutral-900"
    >
      <div class="space-y-2" *ngIf="!loading">
        <ng-container
          *ngFor="let purchaseInvoiceDetail of purchaseInvoiceDetails"
        >
          <button
            [disabled]="purchaseInvoiceDetail.product.isExist == true"
            class="relative grid w-full cursor-pointer items-center gap-2 rounded-md border border-zinc-100/70 bg-zinc-100/70 p-2 text-left text-xs hover:border-sky-600 dark:border-zinc-800 dark:bg-zinc-800 hover:dark:border-sky-600"
            (click)="onSelectProduct(purchaseInvoiceDetail)"
          >
            <div
              class="flex w-full items-start justify-between"
              [ngClass]="{
                'opacity-50': purchaseInvoiceDetail.product.isExist == true,
              }"
            >
              <div class="flex gap-5">
                <div
                  class="aspect-square w-14 flex-none rounded-lg bg-white object-cover"
                >
                  <fc-image-preview
                    [preview]="true"
                    [src]="
                      purchaseInvoiceDetail.product.product_images[0].url
                        ? purchaseInvoiceDetail.product.product_images[0].url
                        : 'assets/images/placeholder/placeholder_small.jpg'
                    "
                    [alt]="'liszthoven'"
                  />
                </div>
                <div class="text-xs">
                  <p class="font-bold capitalize">
                    {{ purchaseInvoiceDetail.product.name }}
                  </p>
                  <p>
                    Remaining Quantity:
                    {{ purchaseInvoiceDetail.remaining_quantity | number }} Pcs
                  </p>
                  <p class="font-bold">
                    {{ purchaseInvoiceDetail.unit_price | fcCurrency }}/pcs
                  </p>
                </div>
              </div>
            </div>
            <div
              class="absolute right-3 top-3 text-xs"
              *ngIf="purchaseInvoiceDetail.product.isExist == true"
            >
              Already exsist
            </div>
          </button>
        </ng-container>
      </div>
    </div>
  </ng-container>
  <ng-container *ngIf="selectedPurchaseInvoiceDetail">
    <form [formGroup]="goodsReceiptDetailForm" class="grid gap-3">
      <div
        class="form-input flex cursor-pointer items-center rounded-lg border border-zinc-200 bg-white p-2 dark:border-zinc-700 dark:bg-zinc-800 dark:hover:bg-zinc-700"
      >
        <div class="flex flex-1 flex-col">
          <p
            class="m-0 block p-0 text-xs font-medium leading-5 text-zinc-700 dark:text-white/60"
          >
            Product
          </p>
          <p *ngIf="goodsReceiptDetailForm.value.product" class="text-xs">
            {{ goodsReceiptDetailForm.value.product.name }}
          </p>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" (click)="removeProduct()" *ngIf="editable">
            <fa-icon [icon]="faTimes" [fixedWidth]="true"></fa-icon>
          </button>
        </div>
      </div>

      <!-- <fc-input-number
        (change)="addSerialNumberField()"
        [disabled]="!goodsReceiptDetailForm.value.product"
        [max]="selectedPurchaseInvoiceDetail.remaining_quantity"
        [title]="
          'Quantity' +
          ' (Max ' +
          selectedPurchaseInvoiceDetail.remaining_quantity +
          ' Pcs)'
        "
        formControlName="quantity"
        placeholder="Enter Quantity">
      </fc-input-number> -->

      <div
        *ngIf="goodsReceiptDetailForm.value.gr_serial_numbers"
        class="w-full"
      >
        <p class="mb-2 text-xs">Serial Number</p>
        <ng-container formArrayName="gr_serial_numbers">
          <div class="flex flex-col gap-3">
            <ng-container
              *ngFor="let serialNumber of serialNumbers.controls; let i = index"
              [formGroupName]="i"
            >
              <fc-input-text
                title="Serial Number"
                formControlName="serial_number"
                [placeholder]="'Input product serial number'"
              />
            </ng-container>
          </div>
        </ng-container>
      </div>

      <div class="flex items-center justify-end gap-2">
        <button
          type="button"
          [ngClass]="isSubmitAllowed() ? 'opacity-100' : 'opacity-25'"
          class="fc-animate-translate-up flex items-center gap-2 rounded-md bg-zinc-200 p-2 text-sm dark:bg-zinc-700"
          (click)="submit()"
          [disabled]="!isSubmitAllowed()"
        >
          Submit
        </button>
      </div>
    </form>
  </ng-container>
</div>
