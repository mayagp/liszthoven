<div class="flex h-full flex-col space-y-3 @container">
  <app-fc-action-bar
    [isHasBackButton]="true"
    [actionButtons]="actionButtons"
    [filterButtons]="filterButtons"
  ></app-fc-action-bar>

  <div class="flex h-full flex-col">
    <div
      class="body flex w-full flex-1 flex-col overflow-y-auto rounded-b-md rounded-tr-md border p-2 text-xs dark:border-zinc-700"
    >
      <div class="tab-view relative flex-1 rounded-lg rounded-tl-none">
        <div class="h-full">
          <ng-container>
            <form
              *ngIf="!loading"
              [formGroup]="registerForm"
              class="flex w-full flex-col gap-3 @2xl:flex-row"
            >
              <div class="w-full @2xl:w-[350px]">

                  class="flex flex-col gap-2"
                  *ngIf="registerForm.value.file"
                >
                  <fc-image-preview
                    class="w-full"
                    [preview]="true"
                    [src]="
                      registerForm.value.file.img_src
                        ? registerForm.value.file.img_src
                        : registerForm.value.file
                    "
                    [alt]="'Happy Beauty'"
                  >
                  </fc-image-preview>

                      Change Image

                </div>
              </div>

              <div class="grid w-full flex-1 gap-3 @xl:grid-cols-2">
                <fc-input-text
                  title="Name"
                  formControlName="name"
                  placeholder="Enter Your Name"
                />
                <fc-input-text
                  title="Username"
                  formControlName="username"
                  placeholder="Enter Your Username"
                  [disabled]="true"
                ></fc-input-text>
                <ng-container formGroupName="staff">
                  <fc-input-text
                    title="Identification Number"
                    formControlName="identification_number"
                    placeholder="Enter Your Identification Number"
                  ></fc-input-text>
                  <fc-input-text
                    title="Tax Number"
                    formControlName="tax_number"
                    placeholder="Enter Your Tax Number"
                  ></fc-input-text>
                  <fc-input-text
                    title="BPJS Number"
                    formControlName="bpjs_number"
                    placeholder="Enter Your BPJS Number"
                  ></fc-input-text>
                  <div class="card w-full">
                    <p-iftalabel>
                      <p-datepicker
                        [style]="{ width: '100%' }"
                        inputId="icondisplay"
                        showIcon
                        iconDisplay="input"
                        [showButtonBar]="true"
                        formControlName="working_since"
                        placeholder="Select Working Since"
                        appendTo="body"
                        dateFormat="dd/mm/yy"
                        [inputStyle]="{
                          'background-color': '#27272a',
                          border: '1px solid #3f3f46',
                          color: '#ffffff',
                          'font-size': '12px',
                          'line-height': '1.7',
                        }"
                      />
                      <label
                        for="xs"
                        style="
                          font-weight: 500 !important;
                          color: #ffffff99 !important;
                        "
                        >Working Since</label
                      >
                    </p-iftalabel>
                  </div>
                </ng-container>
                <fc-input-text
                  title="Email"
                  formControlName="email"
                  [disabled]="true"
                  placeholder="Enter Your Email"
                ></fc-input-text>
                <fc-input-tel
                  title="Phone Number"
                  formControlName="phone_no"
                  placeholder="Enter Your Phone Number"
                >
                </fc-input-tel>
                <fc-input-text
                  title="Address"
                  formControlName="address"
                  placeholder="Enter Staff Address"
                />
                <ng-container formGroupName="staff">
                  <div class="card flex justify-center">
                    <p-iftalabel class="w-full">
                      <p-select
                        formControlName="role"
                        inputId="dd-type"
                        [options]="roles"
                        optionLabel="label"
                        optionValue="id"
                        placeholder="Select Role Name"
                        styleClass="w-full"
                        [style]="{
                          'background-color': '#27272a',
                          color: '#ffffff',
                          border: '1px solid #3f3f46',
                          'line-height': '1.5',
                        }"
                      >
                      </p-select>
                      <label
                        for="dd-type"
                        style="
                          font-weight: 500 !important;
                          color: #ffffff99 !important;
                          line-height: 1.4 !important;
                        "
                        >Role Name</label
                      >
                    </p-iftalabel>
                  </div>
                  <div
                    class="form-input flex cursor-pointer items-center rounded-lg border border-zinc-200 bg-whita p-2 dark:border-zinc-700 dark:bg-zinc-800 dark:hover:bg-zinc-700"
                  >
                    <div
                      class="flex flex-1 flex-col"
                      (click)="onSelectBranch()"
                    >
                      <p
                        class="m-0 block p-0 text-xs font-medium leading-5 text-zinc-700 dark:text-white/60"
                      >
                        Branch
                      </p>
                      <p *ngIf="staffForm.value.branch" class="text-xs">
                        {{ staffForm.value.branch?.address }}
                      </p>
                      <p
                        *ngIf="!staffForm.get('branch')?.value"
                        class="text-xs dark:text-gray-400"
                      >
                        Select Branch
                      </p>
                    </div>
                    <div class="flex items-center gap-2">
                      <button
                        *ngIf="staffForm.get('branch')?.value"
                        type="button"
                        (click)="removeBranch()"
                      >
                        <fa-icon [icon]="faTimes" [fixedWidth]="true"></fa-icon>
                      </button>

                      <button type="button" (click)="onSelectBranch()">
                        <fa-icon
                          [fixedWidth]="true"
                          [icon]="faChevronDown"
                        ></fa-icon>
                      </button>
                    </div>
                  </div>
                  <div class="@xl:col-span-2">
                    <fc-textarea
                      title="Note"
                      formControlName="note"
                      placeholder="Enter Staff Note"
                    />
                  </div>
                </ng-container>
